name: Compile CrossDiTo Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Compile release builds"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Configure release version
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([._-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "/^\[crossdito\]$/,/^\[/s/^version = .*/version = $VERSION/" platformio.ini

      - name: Build CrossDiTo for X4 Pro
        env:
          CROSSINK_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pio run -e x4-pro

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: CrossDiTo v${{ env.RELEASE_VERSION }}
          draft: true
          body_path: docs/releases/v${{ env.RELEASE_VERSION }}.md
          files: |
            .pio/build/x4-pro/CrossDiTo-x4-pro-v${{ env.RELEASE_VERSION }}.bin
