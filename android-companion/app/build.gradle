plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.crossdito.companion'
    compileSdk 35

    defaultConfig {
        applicationId "com.crossdito.companion"
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "0.9"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // Auto-provision JDK 17 via the foojay resolver in settings.gradle
    // (the host only ships JREs); also drives the Java compile toolchain.
    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    // Intentionally dependency-free beyond the platform: BLE via
    // android.bluetooth, JSON via org.json, UI via classic Views.
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Crash reporting (auto-init from the DSN meta-data in the manifest).
    implementation 'io.sentry:sentry-android:8.16.0'
    testImplementation 'junit:junit:4.13.2'
}
